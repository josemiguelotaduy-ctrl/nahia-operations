name: Sync Catalog & Operations Feed
on:
  schedule:
    # Cada hora en punto 24/7 en la nube de GitHub
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ChatGPT Product Feed & Operations Center
        run: python3 build_operations.py
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      - name: Commit and Push if changed
        run: |
          git config user.name "nahia-operations-bot"
          git config user.email "bot@users.noreply.github.com"
          git add chatgpt_products.csv feed_status.json index.html
          git diff --cached --quiet || git commit -m "Hourly catalog sync $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
